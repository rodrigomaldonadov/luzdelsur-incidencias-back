server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: incidencias-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/incidencias}
    username: ${DB_USER:incidencias}
    password: ${DB_PASSWORD:incidencias}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /docs
    operations-sorter: method

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:1.0.0}
    description: API REST y motor de agrupacion heuristica de incidencias electricas

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    # TEMPORAL: la autenticacion JWT y los roles los implementa Persona 3.
    # Mientras tanto, el rol se lee de la cabecera X-Actor-Role.
    dev-default-role: ${APP_DEV_DEFAULT_ROLE:OPERADOR}
  grouping:
    window-minutes: ${GROUPING_WINDOW_MINUTES:30}
    max-candidates: ${GROUPING_MAX_CANDIDATES:5}
  embeddings:
    enabled: ${EMBEDDINGS_ENABLED:true}
    base-url: ${EMBEDDINGS_BASE_URL:http://localhost:8000}
    timeout-ms: ${EMBEDDINGS_TIMEOUT_MS:1500}
    cooldown-seconds: ${EMBEDDINGS_COOLDOWN_SECONDS:30}
    match-threshold: ${EMBEDDINGS_MATCH_THRESHOLD:0.55}
    conflict-threshold: ${EMBEDDINGS_CONFLICT_THRESHOLD:0.30}

logging:
  level:
    root: INFO
    pe.edu.upc.luzdelsur: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

spring:
  datasource:
    url: jdbc:h2:mem:incidencias;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

app:
  security:
    allow-dev-headers: true
    dev-default-role: CLIENTE
    jwt:
      secret: clave-de-pruebas-solo-para-tests-0123456789abcdef
  demo:
    seed-users: false
    seed-reports: false
  grouping:
    window-minutes: 30
    max-candidates: 5
  embeddings:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    pe.edu.upc.luzdelsur: INFO

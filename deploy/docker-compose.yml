name: luzdelsur-incidencias

services:
  db:
    image: postgres:17-alpine
    container_name: lds-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidencias}
      POSTGRES_USER: ${POSTGRES_USER:-incidencias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_requerido}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  embeddings:
    build:
      context: ${EMBEDDINGS_CONTEXT:-../embeddings}
    image: ${EMBEDDINGS_IMAGE:-luzdelsur/embeddings:latest}
    container_name: lds-embeddings
    environment:
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../backend
    image: ${BACKEND_IMAGE:-luzdelsur/incidencias-backend:latest}
    container_name: lds-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-incidencias}
      DB_USER: ${POSTGRES_USER:-incidencias}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_requerido}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      SERVER_PORT: "8080"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://localhost}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://localhost}
      APP_DEV_DEFAULT_ROLE: ${APP_DEV_DEFAULT_ROLE:-CLIENTE}
      APP_ALLOW_DEV_HEADERS: ${APP_ALLOW_DEV_HEADERS:-false}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET_requerido}
      APP_JWT_ACCESS_TTL_MINUTES: ${APP_JWT_ACCESS_TTL_MINUTES:-60}
      APP_JWT_REFRESH_TTL_DAYS: ${APP_JWT_REFRESH_TTL_DAYS:-7}
      APP_AUTH_ALLOW_STAFF_REGISTRATION: ${APP_AUTH_ALLOW_STAFF_REGISTRATION:-false}
      APP_DEMO_SEED_USERS: ${APP_DEMO_SEED_USERS:-true}
      APP_DEMO_SEED_REPORTS: ${APP_DEMO_SEED_REPORTS:-true}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:?APP_DEMO_PASSWORD_requerido}
      GROUPING_WINDOW_MINUTES: ${GROUPING_WINDOW_MINUTES:-30}
      GROUPING_MAX_CANDIDATES: ${GROUPING_MAX_CANDIDATES:-5}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
      EMBEDDINGS_BASE_URL: http://embeddings:8000
      EMBEDDINGS_TIMEOUT_MS: ${EMBEDDINGS_TIMEOUT_MS:-1500}
      EMBEDDINGS_COOLDOWN_SECONDS: ${EMBEDDINGS_COOLDOWN_SECONDS:-30}
      EMBEDDINGS_MATCH_THRESHOLD: ${EMBEDDINGS_MATCH_THRESHOLD:-0.55}
      EMBEDDINGS_CONFLICT_THRESHOLD: ${EMBEDDINGS_CONFLICT_THRESHOLD:-0.30}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseContainerSupport}"
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.27-alpine
    container_name: lds-proxy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  pgdata:

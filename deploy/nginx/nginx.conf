user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"referer":"$http_referer",'
        '"user_agent":"$http_user_agent","request_time":$request_time}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 1m;

    limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=report_zone:10m rate=2r/s;
    limit_req_status 429;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 512;

    include /etc/nginx/conf.d/*.conf;
}
